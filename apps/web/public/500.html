<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Server error</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0a0a0a;
        color: #ffffff;
      }
      .wrap {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 4rem 1.5rem;
      }
      .panel {
        max-width: 48rem;
        width: 100%;
        border-radius: 28px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.04);
        padding: 2.5rem;
        text-align: center;
      }
      .eyebrow {
        color: #f2c94c;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        font-size: 0.75rem;
        margin: 0;
      }
      h1 {
        margin: 1rem 0;
        font-size: 2.25rem;
        letter-spacing: 0.2em;
        text-transform: uppercase;
      }
      p {
        color: rgba(255, 255, 255, 0.7);
        margin: 0 0 2rem;
      }
      a {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0.9rem 2.2rem;
        border-radius: 999px;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #ffffff;
        text-decoration: none;
        font-size: 0.75rem;
        letter-spacing: 0.22em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="panel">
        <p class="eyebrow">Server error</p>
        <h1>We&apos;ll be back soon</h1>
        <p>The site hit an unexpected error. Please try again later or return home.</p>
        <a href="/">Return Home</a>
      </div>
    </div>
  </body>
</html>
